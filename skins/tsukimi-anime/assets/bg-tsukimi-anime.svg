<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Makoto Shinkai inspired twilight indigo-violet-rose sky -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="28%" stop-color="#0d1538"/>
      <stop offset="56%" stop-color="#1e245c"/>
      <stop offset="78%" stop-color="#48307a"/>
      <stop offset="92%" stop-color="#8b4286"/>
      <stop offset="100%" stop-color="#e879a8"/>
    </linearGradient>

    <radialGradient id="moonHaloOuter" cx="74%" cy="24%" r="34%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.58"/>
      <stop offset="24%" stop-color="#7dd3fc" stop-opacity="0.28"/>
      <stop offset="56%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b1026" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaLavender" cx="24%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.24"/>
      <stop offset="48%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b1026" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="horizonGlow" cx="56%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#c084fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#161d42" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="moonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="cloudRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.55"/>
      <stop offset="32%" stop-color="#a5b4fc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.48"/>
    </linearGradient>

    <linearGradient id="cloudPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="0.42"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="meteorTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="62%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2667"/>
      <stop offset="35%" stop-color="#181c47"/>
      <stop offset="100%" stop-color="#070a1c"/>
    </linearGradient>

    <!-- Mask to carve crisp crescent moon -->
    <mask id="crescentMask">
      <rect width="1920" height="1080" fill="black"/>
      <circle cx="1420" cy="255" r="92" fill="white"/>
      <circle cx="1376" cy="224" r="82" fill="black"/>
    </mask>

    <!-- Reusable 4-point anime starlight sparkle -->
    <path id="sparkle" d="M 0,-18 C 1.8,-4 4,-1.8 18,0 C 4,1.8 1.8,4 0,18 C -1.8,4 -4,1.8 -18,0 C -4,-1.8 -1.8,-4 0,-18 Z"/>
  </defs>

  <!-- Sky base & atmospheric nebulae -->
  <rect width="1920" height="1080" fill="url(#twilightSky)"/>
  <rect width="1920" height="1080" fill="url(#nebulaLavender)"/>
  <rect width="1920" height="1080" fill="url(#moonHaloOuter)"/>
  <rect width="1920" height="1080" fill="url(#horizonGlow)"/>

  <!-- Fine constellation starfield -->
  <g fill="#e0f2fe">
    <circle cx="120" cy="96" r="1.8" opacity="0.85"/>
    <circle cx="245" cy="182" r="1.3" opacity="0.7"/>
    <circle cx="385" cy="112" r="2.1" opacity="0.9"/>
    <circle cx="510" cy="215" r="1.4" opacity="0.65"/>
    <circle cx="640" cy="88" r="1.6" opacity="0.8"/>
    <circle cx="790" cy="168" r="2.2" opacity="0.92"/>
    <circle cx="940" cy="118" r="1.4" opacity="0.7"/>
    <circle cx="1095" cy="196" r="1.7" opacity="0.82"/>
    <circle cx="1235" cy="108" r="1.5" opacity="0.75"/>
    <circle cx="1635" cy="142" r="2.0" opacity="0.88"/>
    <circle cx="1775" cy="228" r="1.5" opacity="0.74"/>
    <circle cx="1845" cy="118" r="1.8" opacity="0.82"/>
    <circle cx="165" cy="340" r="1.5" opacity="0.68"/>
    <circle cx="440" cy="378" r="1.9" opacity="0.82"/>
    <circle cx="690" cy="312" r="1.3" opacity="0.65"/>
    <circle cx="885" cy="405" r="1.6" opacity="0.72"/>
    <circle cx="1160" cy="348" r="1.4" opacity="0.66"/>
    <circle cx="1690" cy="385" r="1.7" opacity="0.76"/>
  </g>

  <!-- Subtle celestial orbital rings around the crescent moon -->
  <g fill="none" stroke="#7dd3fc" stroke-opacity="0.16">
    <circle cx="1420" cy="255" r="142" stroke-width="1.2"/>
    <circle cx="1420" cy="255" r="196" stroke-width="1" stroke-dasharray="4 10"/>
    <ellipse cx="1420" cy="255" rx="285" ry="72" transform="rotate(-18 1420 255)" stroke="#c084fc" stroke-opacity="0.2" stroke-width="1.2"/>
  </g>

  <!-- Luminous silver-cyan crescent moon -->
  <circle cx="1420" cy="255" r="92" fill="url(#moonBody)" mask="url(#crescentMask)"/>

  <!-- Cascading Makoto Shinkai shooting stars / comet streaks -->
  <g stroke-linecap="round">
    <line x1="340" y1="90" x2="660" y2="275" stroke="url(#meteorTrail)" stroke-width="2.8"/>
    <circle cx="660" cy="275" r="3.6" fill="#ffffff"/>
    <line x1="890" y1="60" x2="1135" y2="205" stroke="url(#meteorTrail)" stroke-width="2"/>
    <circle cx="1135" cy="205" r="2.8" fill="#e0f2fe"/>
    <line x1="120" y1="240" x2="310" y2="352" stroke="url(#meteorTrail)" stroke-width="1.6" opacity="0.75"/>
    <circle cx="310" cy="352" r="2.2" fill="#f5d0fe"/>
  </g>

  <!-- Iconic 4-point anime starlight sparkles -->
  <use href="#sparkle" transform="translate(1548 168) scale(1.1)" fill="#e0f2fe" opacity="0.92"/>
  <use href="#sparkle" transform="translate(1286 322) scale(0.75)" fill="#7dd3fc" opacity="0.86"/>
  <use href="#sparkle" transform="translate(660 275) scale(0.95)" fill="#ffffff" opacity="0.95"/>
  <use href="#sparkle" transform="translate(485 186) scale(0.68)" fill="#f5d0fe" opacity="0.8"/>
  <use href="#sparkle" transform="translate(1038 286) scale(0.62)" fill="#c084fc" opacity="0.82"/>
  <use href="#sparkle" transform="translate(260 442) scale(0.72)" fill="#7dd3fc" opacity="0.75"/>
  <use href="#sparkle" transform="translate(1740 462) scale(0.64)" fill="#f472b6" opacity="0.78"/>

  <!-- Layered cel-shaded twilight clouds -->
  <path d="M -60 725 C 90 650 230 620 385 655 C 470 595 620 580 745 640 C 860 615 990 645 1080 710 L -60 760 Z" fill="url(#cloudRim)"/>
  <path d="M 880 745 C 1020 675 1170 645 1335 672 C 1450 610 1630 595 1765 655 C 1850 635 1920 655 1980 695 L 1980 800 L 880 800 Z" fill="url(#cloudPink)"/>
  <path d="M -80 810 C 120 740 310 735 510 775 C 690 720 890 740 1090 790 C 1320 735 1560 740 1980 800 L 1980 875 L -80 875 Z" fill="#1b1b4b" fill-opacity="0.56"/>

  <!-- Distant twilight mountain ridges -->
  <path d="M 0 865 L 190 785 L 365 835 L 590 760 L 820 830 L 1060 775 L 1310 838 L 1565 765 L 1790 818 L 1920 792 L 1920 890 L 0 890 Z" fill="#121438" fill-opacity="0.88"/>

  <!-- Moonlit reflective water horizon -->
  <rect x="0" y="886" width="1920" height="194" fill="url(#lakeWater)"/>
  <g fill="#7dd3fc" fill-opacity="0.28">
    <rect x="1325" y="902" width="190" height="3.5" rx="2"/>
    <rect x="1352" y="918" width="136" height="3" rx="1.5" opacity="0.8"/>
    <rect x="1338" y="936" width="164" height="2.6" rx="1.3" opacity="0.65"/>
    <rect x="1368" y="956" width="104" height="2.4" rx="1.2" opacity="0.52"/>
    <rect x="1386" y="978" width="68" height="2" rx="1" opacity="0.4"/>
    <rect x="1398" y="1002" width="44" height="1.8" rx="0.9" opacity="0.32"/>
  </g>
  <g fill="#f472b6" fill-opacity="0.2">
    <rect x="420" y="910" width="240" height="2.4" rx="1.2"/>
    <rect x="780" y="928" width="195" height="2" rx="1"/>
    <rect x="155" y="950" width="160" height="2" rx="1"/>
  </g>
</svg>

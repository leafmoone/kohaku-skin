name: kohaku-skin
version: 0.2.1
framework: ">=2.2.0,<3.0.0"
license: MIT
author: leafmoone
description: Extensible UI skin, boot intro cinema, live wallpaper, and session readability engine for KohakuTerrarium.
repository: https://github.com/leafmoone/kohaku-skin
ui:
  sdk: ">=1.2,<2"
  root: ui
  entry: ui/index.js
  styles: [ui/style.css]
  i18n: { en: ui/i18n/en.json, zh-CN: ui/i18n/zh-CN.json, zh-TW: ui/i18n/zh-TW.json }
  handler: kohaku_skin.ui_owner:PackageUI
  api: kohaku_skin.api:router
  contributes:
    - kind: settings
      id: preferences
      label: Skin & Appearance
      owner: package
    - kind: overlay
      id: stage
      label: Skin Runtime Stage
      anchor: top-left
      width: 1
      height: 1
      draggable: false
      resizable: false
      clickThrough: true
      defaultVisible: true
      surface: app
    - kind: command
      id: toggle-switcher
      label: Toggle Skin Panel
      shortcut: Ctrl+Alt+S
    - kind: status-item
      id: quick-toggle
      label: Skin & Appearance
      owner: package
      side: right
      maxWidth: 32
